<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorry Aakruti! 🥺</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffeef8 0%, #f0e6ff 50%, #e8f0fe 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 24px;
      padding: 30px 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #ff758c, #ff7eb3, #7873f5);
    }

    .emoji-header {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 6px;
    }

    .short-msg {
      font-size: 0.95rem;
      color: #4b5563;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .multiplier-box {
      background: #fdf2f8;
      border: 1px dashed #f472b6;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .multiplier-box p {
      font-size: 0.88rem;
      color: #831843;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .input-row input {
      width: 110px;
      padding: 8px 12px;
      border: 1.5px solid #f472b6;
      border-radius: 10px;
      font-size: 0.95rem;
      text-align: center;
      outline: none;
    }

    .input-row button {
      background: #ec4899;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .sorry-stream {
      max-height: 120px;
      overflow-y: auto;
      text-align: left;
      margin-top: 10px;
      font-size: 0.82rem;
      color: #9d174d;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #fce7f3;
      display: none;
      line-height: 1.4;
    }

    .question {
      font-size: 0.98rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #374151;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      position: relative;
      min-height: 48px;
    }

    .btn-yes {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      padding: 10px 22px;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 50px;
      border: none;
      cursor: pointer;
    }

    .btn-no {
      background: #f3f4f6;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      padding: 10px 22px;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      position: absolute;
    }

    .celebration {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div id="apologyContent">
      <div class="emoji-header">🥺🩹</div>
      <h1>My bad, Aakruti!</h1>
      <p class="short-msg">
        I know I was annoying and messed up. Please drop the anger now, your grumpy face doesn't suit you at all.
      </p>

      <!-- Multiplier Box -->
      <div class="multiplier-box">
        <p>How many "sorry"s to fix your mood? Enter below 👇</p>
        <div class="input-row">
          <input type="number" id="sorryCount" placeholder="e.g. 50" min="1" max="10000" />
          <button onclick="generateSorries()">Spam Me</button>
        </div>
        <div class="sorry-stream" id="sorryStream"></div>
      </div>

      <p class="question">Are we good now? 🤝</p>

      <div class="btn-group">
        <button class="btn-yes" onclick="acceptApology()">Fine, forgiven ❤️</button>
        <button class="btn-no" id="noBtn" onmouseover="dodgeButton()" onclick="dodgeButton()">Still mad 😤</button>
      </div>
    </div>

    <!-- Screen shown when she clicks Yes -->
    <div class="celebration" id="celebrationScreen">
      <div class="emoji-header">🥳🎉✨</div>
      <h2 style="color: #4f46e5; margin-bottom: 8px;">Yay! Mood fixed!</h2>
      <p style="color: #4b5563; font-size: 0.95rem;">
        Thanks for not staying mad. Treat's on me next time! 🍕🤝
      </p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');

    function dodgeButton() {
      const card = document.getElementById('mainCard');
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = (cardRect.width / 2) - (btnRect.width / 2) - 15;
      const maxY = 80;

      const randomX = (Math.random() * (maxX * 2)) - maxX;
      const randomY = (Math.random() * (maxY * 2)) - maxY;

      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    function generateSorries() {
      const countInput = document.getElementById('sorryCount');
      const stream = document.getElementById('sorryStream');
      const count = parseInt(countInput.value, 10);

      if (isNaN(count) || count <= 0) return;

      const safeCount = Math.min(count, 5000);
      let list = [];

      for (let i = 1; i <= safeCount; i++) {
        list.push(`${i}. Sorry Aakruti! 🥺`);
      }

      if (count > 5000) {
        list.push(`...and ${count - 5000} more! (Infinite sorry)`);
      }

      stream.innerHTML = list.join('<br>');
      stream.style.display = 'block';
      stream.scrollTop = stream.scrollHeight;
    }

    function acceptApology() {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      document.getElementById('apologyContent').style.display = 'none';
      document.getElementById('celebrationScreen').style.display = 'block';
    }
  </script>
</body>
</html>
